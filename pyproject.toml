# PEP 621 project metadata + build config. Single source of truth for
# dependencies, Python version floor, package layout, and console entry points.
# Replaces the earlier `requirements.txt`.

[build-system]
# Hatchling is a modern, PEP 517-compliant build backend. Picked over setuptools
# because this is a pure-Python package with no C extensions / no exotic build
# steps — hatchling needs ~zero configuration for that case.
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mtg-recommender"
version = "0.1.0"
description = "Recommend Magic: The Gathering cards for a decklist, grounded in Scryfall oracle text."
readme = "README.md"
# 3.10 floor matches `from __future__ import annotations` + 3.10-style union
# syntax (`list[str] | None`) used throughout the modules.
requires-python = ">=3.10"
authors = [{ name = "Sean" }]
keywords = ["magic", "mtg", "commander", "scryfall", "recommender"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Games/Entertainment",
]

# Runtime deps for Phase 1 persistence. Kept minimal; heavier embedding libs
# arrive in Phase 2.
#
# Expected additions:
#   Phase 2 (embeddings) — sentence-transformers (pulls torch), numpy, scikit-learn
dependencies = [
    # pymongo >=4.6,<4.11 — 4.6 is the current LTS line (aligns with
    # Atlas 7.x and the Stable API v1 bits); the <4.11 upper bound is a
    # mongomock compatibility pin. pymongo 4.11 added a `sort` kwarg to
    # UpdateOne/UpdateMany, which mongomock 4.3 (the latest release at
    # time of writing) does not understand. Loosen the upper bound when
    # mongomock catches up.
    "pymongo>=4.6,<4.11",
    # python-dotenv lets `pip install -e .` + a local .env file "just work"
    # for CLI runs. The storage module falls back to os.environ when dotenv
    # isn't installed, so this is optional-but-nice; keeping it in runtime
    # deps because the user flow depends on it.
    "python-dotenv>=1.0",
    # sentence-transformers is the encoder used by the mtg-embed CLI. It
    # pulls torch (~1 GB); the project's audience is small enough that we
    # don't maintain a separate "Phase 1 only" slim install. 2.7 is the
    # current stable line and ships the API we rely on
    # (SentenceTransformer.encode kwargs).
    "sentence-transformers>=2.7",
]

# Optional extras let a user opt into heavier dep groups:
#   pip install -e ".[dev]"
[project.optional-dependencies]
dev = [
    # mongomock provides an in-memory pymongo-compatible Mongo client. The
    # test suite uses it to keep every test offline and fast; it is not
    # imported by any runtime code.
    "mongomock>=4.1",
    # ruff is the linter run by `just lint` and the CI workflow.
    "ruff>=0.6",
]

# Console scripts exposed by `pip install`. Every main() returns an int exit
# code, so the generated wrappers propagate those to the shell.
[project.scripts]
scryfall-fetch = "mtg_recommender.scryfall_fetch:main"
scryfall-fetch-tags = "mtg_recommender.oracle_tags:main"
extract-oracle = "mtg_recommender.extract_oracle:main"
mtg-inspect = "mtg_recommender.explore:main"
mtg-check = "mtg_recommender.check:main"
mtg-embed = "mtg_recommender.embeddings:main"

# -----------------------------------------------------------------------------
# Hatchling-specific configuration
# -----------------------------------------------------------------------------

# Tell hatchling where the package lives. Without this, hatch auto-detects, but
# an explicit declaration is safer and documents the layout.
[tool.hatch.build.targets.wheel]
packages = ["src/mtg_recommender"]

# -----------------------------------------------------------------------------
# Ruff — linter config
# -----------------------------------------------------------------------------

[tool.ruff]
# Match the Python floor declared in [project].requires-python.
target-version = "py310"
# A bit roomier than the default 88 — the project's docstrings tolerate wider.
line-length = 100

[tool.ruff.lint]
# Start conservative: pyflakes (F) catches real bugs; pycodestyle errors (E)
# catch basic syntax hygiene; isort (I) keeps imports sorted. Expand later
# as the project grows.
select = ["E", "F", "I"]
# E501 (line too long) off because the project's house style tolerates longer
# docstring lines; we'll revisit if real code starts drifting.
ignore = ["E501"]
