name: CI

# Lint + offline test suite on every push to main and every PR.
# The integration tests under tests/integration/ are deliberately not run
# in CI — they need a MONGODB_INTEGRATION_URI we're not willing to put in
# a repository secret for this project.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project with dev extras
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Test (offline suite)
        run: python -m unittest discover tests
